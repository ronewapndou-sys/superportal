server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Load balancer / orchestrator health check: instant 200, no disk read, not logged.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Hashed build assets (JS/CSS/images) never change content under the same name — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else: serve the file if it exists (e.g. mockServiceWorker.js, public/onboarding/*.html),
    # otherwise fall back to index.html so React Router can handle the route client-side.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
